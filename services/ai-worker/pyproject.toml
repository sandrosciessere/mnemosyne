[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "realmodel: loads the real local models; needs REALMODEL=1 and provisioned HF cache (run with -m realmodel)",
]
