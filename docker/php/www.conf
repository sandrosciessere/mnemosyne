[www]
; Run pool workers as the mnemosyne user (uid/gid 1003, matches host owner
; of /srv/data/mnemosyne) so bind-mounted data is never root-owned.
user = mnemosyne
group = mnemosyne

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 1000

; Environment variables from the container must reach PHP
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
