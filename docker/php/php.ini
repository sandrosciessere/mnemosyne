; Mnemosyne PHP runtime settings
expose_php = Off
memory_limit = 512M

; EPUB uploads (future) — keep consistent with nginx client_max_body_size
upload_max_filesize = 1G
post_max_size = 1G
max_file_uploads = 20

; Opcache: code is baked into the image, no timestamp validation needed
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Logging to container stderr
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off
