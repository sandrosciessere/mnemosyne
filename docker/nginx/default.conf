server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    # EPUB uploads (future) — keep consistent with PHP post_max_size
    client_max_body_size 1G;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # Path of the document root inside the app container
        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
    }

    location ~* \.(?:css|js|mjs|map|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
